name: Build Tamagotchi 3D Dotbench package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/tamagotchi/**"
      - ".github/workflows/build-tamagotchi-dotbench.yml"

permissions:
  contents: read

jobs:
  build-dotbench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Install package builder
        run: |
          git clone --depth 1 https://github.com/murilogpapa/kodedot-sim.git /tmp/kodedot-sim
          cd /tmp/kodedot-sim
          tools/setup.sh
      - name: Build simulator SDK
        shell: bash
        run: |
          cd /tmp/kodedot-sim
          source .dotbench-env
          tools/dotbench sdk
      - name: Create app icon
        run: |
          python3 - <<'PY'
          import base64
          png = "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+/pV8AAAAASUVORK5CYII="
          with open("apps/tamagotchi/appdata/icon.png", "wb") as f:
              f.write(base64.b64decode(png))
          PY
      - name: Build Tamagotchi 3D package
        shell: bash
        run: |
          cd /tmp/kodedot-sim
          source .dotbench-env
          tools/dotbench build "$GITHUB_WORKSPACE/apps/tamagotchi"
      - name: Verify package contents
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          matches = list(Path("/tmp/kodedot-sim/build/apps").rglob("*.zip"))
          if not matches:
              raise SystemExit("No Dotbench ZIP package was produced")
          package = max(matches, key=lambda p: p.stat().st_mtime)
          with ZipFile(package) as z:
              names = z.namelist()
              print("Package:", package, "bytes:", package.stat().st_size)
              print("Entries:", names)
              if not any(n.endswith(".wasm") for n in names):
                  raise SystemExit("Package has no WebAssembly binary")
              if not any("app.json" in n for n in names):
                  raise SystemExit("Package has no app metadata")
          Path("tamagotchi-3d-dotbench.zip").write_bytes(package.read_bytes())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tamagotchi-3d-dotbench
          path: tamagotchi-3d-dotbench.zip
          if-no-files-found: error
