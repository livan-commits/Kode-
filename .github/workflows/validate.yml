name: Validate Kode Ecosystem
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
      - name: Validate catalog JSON
        run: |
          python -m json.tool applications/catalog.json >/dev/null
          python -m json.tool connectors/providers.json >/dev/null
      - name: Validate catalog invariants
        run: |
          python - <<'PY'
          import json
          apps = json.load(open("applications/catalog.json"))["applications"]
          providers = json.load(open("connectors/providers.json"))["providers"]
          assert len(apps) == 113, f"Expected 113 apps, got {len(apps)}"
          assert len({a["code"] for a in apps}) == 113, "Duplicate app codes"
          assert len({a["slug"] for a in apps}) == 113, "Duplicate app slugs"
          assert all(a["lifecycle"] == "planned" for a in apps)
          assert all(p["status"] == "planned" for p in providers)
          assert len({p["slug"] for p in providers}) == len(providers)
          print(f"Validated {len(apps)} applications and {len(providers)} planned providers")
          PY
      - name: Check required project files
        run: |
          test -f README.md
          test -f docs/architecture.md
          test -f docs/security-review.md
          test -f connectors/README.md
          test -f supabase/migrations/20261117192540_auth_lifecycle_and_initial_catalog.sql
      - name: Validate Edge Function source
        run: |
          test -f supabase/functions/account-dashboard/index.ts
          test -f supabase/functions/account-dashboard/deno.json
          grep -q 'supabase.auth.getUser' supabase/functions/account-dashboard/index.ts
          grep -q 'oauth_tokens_never_returned' supabase/functions/account-dashboard/index.ts
      - name: Check connector review documentation
        run: |
          test -f docs/connector-capability-review.md
          test -f docs/account-dashboard-api.md
          test -f docs/portal-authentication.md
          test -f supabase/migrations/20261117194058_connector_auth_state_store.sql
          test -f supabase/migrations/20261117194131_connector_auth_state_rpc.sql
          test -f supabase/migrations/20261117194629_revoke_connected_account.sql
          test -f supabase/migrations/20261117195600_explicit_private_auth_state_deny.sql
          test -f supabase/migrations/20261117195700_index_private_auth_state_user.sql
          test -f supabase/migrations/20261117202915_unique_connector_permissions.sql
          test -f supabase/functions/steam-openid-start/index.ts
          test -f supabase/functions/steam-openid-callback/index.ts
          test -f supabase/functions/connector-disconnect/index.ts
          test -f supabase/functions/steam-sync/index.ts
          test -f supabase/functions/steam-sync/deno.json
          test -f supabase/functions/google-oauth-start/index.ts
          test -f supabase/functions/google-oauth-start/deno.json
          test -f supabase/functions/google-oauth-callback/index.ts
          test -f supabase/functions/google-oauth-callback/deno.json
          test -f supabase/functions/discord-oauth-start/index.ts
          test -f supabase/functions/discord-oauth-start/deno.json
          test -f supabase/functions/discord-oauth-callback/index.ts
          test -f supabase/functions/discord-oauth-callback/deno.json
      - name: Validate portal JavaScript
        run: |
          node --input-type=module --check < app.js
          grep -q 'supabase-js@2.119.0' app.js
          grep -q 'functions/v1/account-dashboard' app.js
          grep -q 'signInWithPassword' app.js
          grep -q 'signUp' app.js
          grep -q 'resetPasswordForEmail' app.js
          grep -q 'PASSWORD_RECOVERY' app.js
          grep -q 'updateUser({password})' app.js
          ! grep -Eq 'service_role|sb_secret_' app.js
      - name: Check account portal markup
        run: |
          grep -q 'id="auth-form"' index.html
          grep -q 'id="user-panel"' index.html
          grep -q 'id="dashboard-content"' index.html
          grep -q 'id="recovery-form"' index.html
          grep -q 'id="connect-steam"' index.html
          grep -q 'steam-openid-start' app.js
          grep -q 'steamcommunity.com/openid/login' supabase/functions/steam-openid-start/index.ts
          grep -q 'check_authentication' supabase/functions/steam-openid-callback/index.ts
          grep -q 'consume_connector_auth_state' supabase/functions/steam-openid-callback/index.ts
          grep -q 'connector-disconnect' app.js
          grep -q 'revoke_connected_account' supabase/functions/connector-disconnect/index.ts
          grep -q 'revoke_connected_account' supabase/migrations/20261117194629_revoke_connected_account.sql
          grep -q 'STEAM_WEB_API_KEY' supabase/functions/steam-sync/index.ts
          grep -q 'steam.library.snapshot' supabase/functions/steam-sync/index.ts
          grep -q 'steam-sync' app.js
          grep -q 'google-oauth-start' app.js
          grep -q 'google.profile.snapshot' supabase/functions/google-oauth-callback/index.ts
          grep -q 'GOOGLE_OAUTH_CLIENT_SECRET' supabase/functions/google-oauth-callback/index.ts
          grep -q 'discord-oauth-start' app.js
          grep -q 'users/@me/connections' supabase/functions/discord-oauth-callback/index.ts
          grep -q 'DISCORD_CLIENT_SECRET' supabase/functions/discord-oauth-callback/index.ts
      - name: Check OAuth and sync safety invariants
        run: |
          for provider in google discord; do
            grep -q 'consume_connector_auth_state' "supabase/functions/${provider}-oauth-callback/index.ts"
            grep -q 'permission_record_failed' "supabase/functions/${provider}-oauth-callback/index.ts"
            grep -q 'snapshot_persistence_failed' "supabase/functions/${provider}-oauth-callback/index.ts"
            grep -q 'retrieved_at' "supabase/functions/${provider}-oauth-callback/index.ts"
            grep -q 'onConflict:"connected_account_id"' "supabase/functions/${provider}-oauth-callback/index.ts"
          done
          grep -q 'steam_account_not_connected' supabase/functions/steam-sync/index.ts
          grep -q 'snapshot_persistence_failed' supabase/functions/steam-sync/index.ts
          grep -q 'sync_metadata_persistence_failed' supabase/functions/steam-sync/index.ts
          ! grep -Eq 'access_token.*(insert|upsert)|refresh_token.*(insert|upsert)' supabase/functions/google-oauth-callback/index.ts
          ! grep -Eq 'access_token.*(insert|upsert)|refresh_token.*(insert|upsert)' supabase/functions/discord-oauth-callback/index.ts
      - name: Type-check Edge Functions
        run: |
          deno check --config supabase/functions/account-dashboard/deno.json supabase/functions/account-dashboard/index.ts
          deno check --config supabase/functions/steam-openid-start/deno.json supabase/functions/steam-openid-start/index.ts
          deno check --config supabase/functions/steam-openid-callback/deno.json supabase/functions/steam-openid-callback/index.ts
          deno check --config supabase/functions/connector-disconnect/deno.json supabase/functions/connector-disconnect/index.ts
          deno check --config supabase/functions/steam-sync/deno.json supabase/functions/steam-sync/index.ts
          deno check --config supabase/functions/google-oauth-start/deno.json supabase/functions/google-oauth-start/index.ts
          deno check --config supabase/functions/google-oauth-callback/deno.json supabase/functions/google-oauth-callback/index.ts
          deno check --config supabase/functions/discord-oauth-start/deno.json supabase/functions/discord-oauth-start/index.ts
          deno check --config supabase/functions/discord-oauth-callback/deno.json supabase/functions/discord-oauth-callback/index.ts
