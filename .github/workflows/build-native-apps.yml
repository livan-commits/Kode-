name: Build native Kode Dot apps

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - ".github/workflows/build-native-apps.yml"
  pull_request:
    paths:
      - "apps/**"
      - ".github/workflows/build-native-apps.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1
    strategy:
      fail-fast: false
      matrix:
        app: [stopwatch, pomodoro, calculator, dice, reaction-test, memory, snake, pong, quiz, tasks, shopping-list, habit-tracker, alarm, reminders, calendar, compass, level, sensor-studio, data-logger, nfc-studio, rfid-studio, ir-studio, battery-monitor, led-studio, music-studio, files, settings, device-diagnostics, network-monitor, wi-fi-analyzer, bluetooth-scanner, tower-stack, subway-runner, tamagotchi, voice-recorder, wav-player, metronome, storage-manager, haptic-studio, compass-calibration, digital-clock, nfc-writer, nfc-share]
    defaults:
      run:
        shell: bash
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32-P4 app image
        run: |
          . "$IDF_PATH/export.sh"
          idf.py build
      - uses: actions/upload-artifact@v4
        with:
          name: kode-${{ matrix.app }}-firmware
          path: apps/${{ matrix.app }}/build/*.bin
          if-no-files-found: error

  build-tamagotchi-dotbench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Dotbench package builder
        run: |
          git clone --depth 1 https://github.com/murilogpapa/kodedot-sim.git /tmp/kodedot-sim
          cd /tmp/kodedot-sim
          tools/setup.sh
      - name: Build simulator SDK
        shell: bash
        run: |
          cd /tmp/kodedot-sim
          source .dotbench-env
          tools/dotbench sdk
      - name: Install icon generator dependency
        run: python3 -m pip install --user Pillow
      - name: Create app icon
        run: |
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          im = Image.new("RGBA", (128, 128), (12, 19, 36, 255))
          d = ImageDraw.Draw(im)
          d.ellipse((20, 35, 108, 112), fill=(49, 190, 137), outline=(178, 244, 207), width=4)
          d.polygon([(43, 48), (30, 13), (58, 38)], fill=(250, 180, 64))
          d.polygon([(78, 44), (101, 10), (94, 54)], fill=(250, 180, 64))
          d.ellipse((48, 58, 59, 70), fill=(255, 255, 244))
          d.ellipse((75, 58, 86, 70), fill=(255, 255, 244))
          d.ellipse((53, 62, 57, 68), fill=(20, 35, 43))
          d.ellipse((80, 62, 84, 68), fill=(20, 35, 43))
          d.arc((56, 73, 81, 91), 5, 165, fill=(20, 35, 43), width=3)
          im.save("apps/tamagotchi/appdata/icon.png")
          PY
      - name: Build Tamagotchi 3D WebAssembly package
        shell: bash
        run: |
          cd /tmp/kodedot-sim
          source .dotbench-env
          tools/dotbench build "$GITHUB_WORKSPACE/apps/tamagotchi"
      - name: Verify and stage ZIP package
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          matches = list(Path("/tmp/kodedot-sim/build/apps").rglob("*.zip"))
          if not matches:
              raise SystemExit("No Dotbench ZIP package was produced")
          package = max(matches, key=lambda p: p.stat().st_mtime)
          with ZipFile(package) as z:
              names = z.namelist()
              print("Package:", package, "bytes:", package.stat().st_size)
              print("Entries:", names)
              if not any(n.endswith(".wasm") for n in names):
                  raise SystemExit("Package has no WebAssembly binary")
              if not any("app.json" in n for n in names):
                  raise SystemExit("Package has no app metadata")
          Path("tamagotchi-3d-dotbench.zip").write_bytes(package.read_bytes())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tamagotchi-3d-dotbench
          path: tamagotchi-3d-dotbench.zip
          if-no-files-found: error
